backend:
  name: git-gateway
  branch: main
  # 如果你使用 GitHub，取消下面这行的注释并填入你的仓库
  # repo: your-username/duyalan-portfolio

# 使用 GitHub OAuth（推荐）
# 1. 去 GitHub Settings > Developer settings > OAuth Apps 创建应用
# 2. 设置 Authorization callback URL 为：https://api.netlify.com/auth/done
# 3. 获取 Client ID 和 Client Secret
# 4. 在 Netlify 后台 Site settings > Access control > OAuth 中填入

# 或者使用 Decap CMS 的 Git Gateway（更简单，通过 Netlify Identity）
# 需要在 Netlify 后台启用 Identity 服务

# 媒体文件上传配置
media_folder: "assets"
public_folder: "/assets"

# 网站基础URL（部署后替换）
# site_url: https://your-site.netlify.app

# 集合定义 - 这就是后台的可编辑内容
collections:

  # ---------- 1. 基础信息 ----------
  - name: "basic"
    label: "📋 基础信息"
    folder: "content"
    create: false
    delete: false
    slug: "basic"
    fields:
      - { label: "姓名", name: "name", widget: "string" }
      - { label: "职位标题", name: "title", widget: "string" }
      - { label: "Logo文字", name: "logo", widget: "string" }
      - { label: "头像图片", name: "avatar", widget: "image", required: false }
      - { label: "顶部徽章", name: "badge", widget: "string" }
      - { label: "个人简介", name: "description", widget: "text" }

  # ---------- 2. 核心数据指标 ----------
  - name: "metrics"
    label: "📊 核心数据指标"
    folder: "content/metrics"
    create: true
    delete: true
    slug: "{{number}}-{{label}}"
    fields:
      - { label: "数字", name: "number", widget: "string", hint: "纯数字或文字如 0-1" }
      - { label: "后缀", name: "suffix", widget: "string", required: false, default: "+" }
      - { label: "标签", name: "label", widget: "string" }
      - { label: "描述", name: "desc", widget: "string" }
      - { label: "颜色", name: "color", widget: "select", options: ["var(--accent)", "var(--accent-green)", "#feb47b", "#ff7e5f", "#a78bfa"] }
      - { label: "是否为文字", name: "isText", widget: "boolean", default: false, hint: "如果是文字如 0-1 请勾选" }

  # ---------- 3. AI 技能舱 ----------
  - name: "skills"
    label: "🧬 AI 技能舱"
    folder: "content/skills"
    create: true
    delete: true
    slug: "{{title}}"
    fields:
      - { label: "板块标题", name: "title", widget: "string" }
      - { label: "颜色", name: "color", widget: "select", options: ["var(--accent)", "var(--accent-green)", "#feb47b"] }
      - { label: "内容描述", name: "content", widget: "text", required: false }
      - label: "技能标签"
        name: "tags"
        widget: "list"
        required: false
        fields:
          - { label: "标签文字", name: "text", widget: "string" }
          - { label: "高亮显示", name: "highlight", widget: "boolean", default: false }

  # ---------- 4. 作品集案例 ----------
  - name: "portfolio"
    label: "💼 作品集案例"
    folder: "content/portfolio"
    create: true
    delete: true
    slug: "{{title}}"
    fields:
      - label: "分类标签"
        name: "tag"
        widget: "object"
        fields:
          - { label: "标签文字", name: "text", widget: "string" }
          - { label: "背景色", name: "bg", widget: "string", default: "rgba(56,189,248,0.1)" }
          - { label: "文字颜色", name: "color", widget: "string", default: "var(--accent)" }
      - { label: "案例标题", name: "title", widget: "string" }
      - { label: "案例摘要", name: "summary", widget: "text" }
      - label: "STAR 分析"
        name: "star"
        widget: "object"
        fields:
          - { label: "S - 背景", name: "situation", widget: "text" }
          - { label: "T - 任务", name: "task", widget: "text" }
          - { label: "A - 行动", name: "action", widget: "text" }
          - { label: "R - 结果", name: "result", widget: "text" }

  # ---------- 5. 工作经历 ----------
  - name: "experience"
    label: "⏳ 工作经历"
    folder: "content/experience"
    create: true
    delete: true
    slug: "{{company}}"
    fields:
      - { label: "公司名称", name: "company", widget: "string" }
      - { label: "职位", name: "position", widget: "string" }
      - { label: "时间段", name: "period", widget: "string", hint: "如: 2023.12 - 至今" }
      - { label: "工作描述", name: "description", widget: "text" }

  # ---------- 6. 教育背景 ----------
  - name: "education"
    label: "🎓 教育背景"
    folder: "content/education"
    create: true
    delete: true
    slug: "{{school}}"
    fields:
      - { label: "学校名称", name: "school", widget: "string" }
      - { label: "专业/学位", name: "degree", widget: "string" }
      - { label: "描述", name: "desc", widget: "string" }
      - { label: "颜色", name: "color", widget: "select", options: ["var(--accent)", "var(--accent-green)", "#feb47b", "#a78bfa"] }

  # ---------- 7. 联系方式 ----------
  - name: "contact"
    label: "⚡ 联系方式"
    folder: "content"
    create: false
    delete: false
    slug: "contact"
    fields:
      - { label: "板块标题", name: "title", widget: "string" }
      - { label: "描述文字", name: "desc", widget: "text" }
      - label: "联系方式列表"
        name: "methods"
        widget: "list"
        fields:
          - { label: "图标", name: "icon", widget: "string", hint: "如: 📱 ✉️" }
          - { label: "标签", name: "label", widget: "string" }
          - { label: "值", name: "value", widget: "string" }
          - { label: "链接", name: "href", widget: "string", hint: "如: tel:18072489144" }
          - { label: "颜色", name: "color", widget: "select", options: ["var(--accent)", "var(--accent-green)", "#feb47b"] }

  # ---------- 8. 页脚 ----------
  - name: "footer"
    label: "📌 页脚"
    folder: "content"
    create: false
    delete: false
    slug: "footer"
    fields:
      - { label: "页脚文字", name: "text", widget: "string" }
